[project]
name = "unreliable-assistant-enterprise"
version = "0.1.0"
description = "Enterprise MCP-based grounded assistant (Build v0.1 of design.md)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "rank-bm25>=0.2.2",
  "PyStemmer>=2.2",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "streamlit>=1.37",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pgserver>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
